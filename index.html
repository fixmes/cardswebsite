<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея Карточек</title>
  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          background-color: #121212;
          color: #ffffff;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          min-height: 100vh;
          padding: 40px 20px;
      }

      .gallery-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
          gap: 30px;
          max-width: 1400px;
          margin: 0 auto;
      }

      .card {
          aspect-ratio: 791 / 1087;
          background-color: #2a2a2a;
          border-radius: 12px;
          overflow: hidden;
          cursor: pointer;
          position: relative;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
          transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
      }

      .card img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transition: opacity 0.3s;
      }

      .card:hover {
          transform: scale(1.05) translateY(-10px);
          box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
      }

      .card:hover img {
          opacity: 0.9;
      }

      .modal {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 1000;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.4s ease;
      }

      .modal.active {
          opacity: 1;
          pointer-events: all;
      }

      .modal-overlay {
          position: absolute;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.9);
          backdrop-filter: blur(5px);
      }

      .modal-content {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: row;
          width: 85%;
          max-width: 1200px;
          height: 80vh;
          border-radius: 16px;
          overflow: hidden;
          transform: scale(0.95);
          transition: transform 0.4s ease;
      }

      .modal.active .modal-content {
          transform: scale(1);
      }

      .modal-left {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
      }

      .modal-left img {
          max-width: 100%;
          max-height: 100%;
          aspect-ratio: 791 / 1087;
          object-fit: contain;
          border-radius: 8px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }

      .modal-right {
          flex: 1;
          padding: 50px;
          display: flex;
          flex-direction: column;
          justify-content: center;
      }

      .modal-right h2 {
          font-size: 2.5rem;
          margin-bottom: 20px;
          color: #fff;
      }

      .modal-right p {
          font-size: 1.2rem;
          line-height: 1.6;
          color: #bbbbbb;
      }

      .nav-btn {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          background: rgba(255, 255, 255, 0.1);
          color: white;
          border: none;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          font-size: 24px;
          cursor: pointer;
          z-index: 20;
          transition: background 0.3s, transform 0.2s;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .nav-btn:hover {
          background: rgba(255, 255, 255, 0.3);
          transform: translateY(-50%) scale(1.1);
      }

      .prev-btn { left: 20px; }
      .next-btn { right: 20px; }

      .close-btn {
          position: absolute;
          top: 20px;
          right: 30px;
          background: none;
          color: white;
          border: none;
          font-size: 36px;
          cursor: pointer;
          z-index: 20;
          transition: color 0.3s;
      }

      .close-btn:hover {
          color: #ff4c4c;
      }

      @keyframes slideNext {
          0% { opacity: 0; transform: translateX(50px); }
          100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes slidePrev {
          0% { opacity: 0; transform: translateX(-50px); }
          100% { opacity: 1; transform: translateX(0); }
      }

      .anim-next { animation: slideNext 0.4s forwards; }
      .anim-prev { animation: slidePrev 0.4s forwards; }

      @media (max-width: 900px) {
          body {
              padding: 20px 10px;
          }

          .gallery-grid {
              grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
              gap: 15px;
          }

          .modal-content {
              flex-direction: column;
              width: 95%;
              height: 90vh;
              overflow-y: auto;
          }

          .modal-left {
              height: auto;
              min-height: 45vh;
              padding: 15px;
          }

          .modal-right {
              height: auto;
              padding: 25px 20px;
              justify-content: flex-start;
          }

          .modal-right h2 {
              font-size: 1.8rem;
              margin-bottom: 12px;
          }

          .modal-right p {
              font-size: 1rem;
          }

          .nav-btn {
              width: 45px;
              height: 45px;
              font-size: 18px;
          }

          .prev-btn { left: 10px; }
          .next-btn { right: 10px; }

          .close-btn {
              top: 10px;
              right: 15px;
              font-size: 30px;
          }
      }
  </style>
</head>
<body>

<div class="gallery-grid" id="gallery">
</div>

<div class="modal" id="modal">
  <div class="modal-overlay" id="overlay"></div>

  <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>

  <div class="modal-content" id="modal-content">
    <div class="modal-left">
      <img id="modal-img" src="" alt="Full Card">
    </div>
    <div class="modal-right">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
    </div>
  </div>

  <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
  <button class="close-btn" id="closeBtn">&times;</button>
</div>

        },

        },

        },
        {
            image: 'cards/image_2026-05-20_18-00-10 (7).png',
            title: 'Lorem ipsum dolor sit amet',
            desc: 'Lorem ipsum dolor sit amet'
        },
        {
            image: 'cards/image_2026-05-20_18-00-10 (8).png',
            title: 'Lorem ipsum dolor sit amet',
            desc: 'Lorem ipsum dolor sit amet'
        },
        {
            image: 'cards/image_2026-05-20_18-00-11.png',
            title: 'Lorem ipsum dolor sit amet',
            desc: 'Lorem ipsum dolor sit amet'
        },
        {
            image: 'cards/image_2026-05-20_18-00-11 (2).png',
            title: 'Lorem ipsum dolor sit amet',
            desc: 'Lorem ipsum dolor sit amet'
        },
        {
            image: 'cards/image_2026-05-20_18-00-11 (3).png',
            title: 'Lorem ipsum dolor sit amet',
            desc: 'Lorem ipsum dolor sit amet'
        },
    ];

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closeBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const modalImg = document.getElementById('modal-img');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalContent = document.getElementById('modal-content');

    let currentIndex = 0;

    cardsData.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.classList.add('card');
        cardEl.innerHTML = `<img src="${card.image}" alt="${card.title}" loading="lazy">`;

        cardEl.addEventListener('click', () => openModal(index));
        gallery.appendChild(cardEl);
    });

    function openModal(index) {
        currentIndex = index;
        updateModalContent();
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function updateModalContent(animationClass = '') {
        const data = cardsData[currentIndex];

        modalContent.classList.remove('anim-next', 'anim-prev');
        void modalContent.offsetWidth;

        if (animationClass) {
            modalContent.classList.add(animationClass);
        }

        modalImg.src = data.image;
        modalTitle.textContent = data.title;
        modalDesc.textContent = data.desc;
    }

    function showNext() {
        currentIndex = (currentIndex + 1) % cardsData.length;
        updateModalContent('anim-next');
    }

    function showPrev() {
        currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
        updateModalContent('anim-prev');
    }

    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', closeModal);
    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);

    document.addEventListener('keydown', (e) => {
        if (!modal.classList.contains('active')) return;

        if (e.key === 'Escape') closeModal();
        if (e.key === 'ArrowRight') showNext();
        if (e.key === 'ArrowLeft') showPrev();
    });
</script>
</body>
</html>
