<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея Карточек</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
          background-color: #121212;
          color: #ffffff;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          min-height: 100vh;
          padding: 40px 20px;
      }

      .filter-bar {
          max-width: 1400px;
          margin: 0 auto 30px;
          padding: 0 20px;
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          align-items: center;
      }

      .filter-label {
          font-size: 0.95rem;
          color: #aaa;
          margin-right: 10px;
      }

      .market-filters {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
      }

      .market-btn {
          padding: 8px 16px;
          background: #2a2a2a;
          border: 1px solid #444;
          border-radius: 20px;
          color: #fff;
          font-size: 0.9rem;
          cursor: pointer;
          transition: all 0.2s;
      }

      .market-btn:hover {
          background: #3a3a3a;
          border-color: #666;
      }

      .market-btn.active {
          background: #6366f1;
          border-color: #6366f1;
          box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      }

      .market-btn.all {
          background: #1a1a2e;
          border-color: #6366f1;
      }

      .gallery-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
          gap: 30px;
          max-width: 1400px;
          margin: 0 auto;
      }

      .card {
          aspect-ratio: 791 / 1087;
          background-color: #2a2a2a;
          border-radius: 12px;
          overflow: hidden;
          cursor: pointer;
          position: relative;
          box-shadow: 0 4px 15px rgba(0,0,0,0.4);
          transition: transform 0.3s cubic-bezier(.175,.885,.32,1.275), box-shadow 0.3s ease;
      }

      .card img {
          width: 100%; height: 100%; object-fit: cover;
          transition: opacity 0.3s;
      }

      .card:hover {
          transform: scale(1.05) translateY(-10px);
          box-shadow: 0 15px 30px rgba(0,0,0,0.6);
      }

      .card:hover img { opacity: 0.9; }

      .modal {
          position: fixed; top: 0; left: 0;
          width: 100%; height: 100%;
          display: flex; align-items: center; justify-content: center;
          z-index: 1000;
          opacity: 0; pointer-events: none;
          transition: opacity 0.4s ease;
      }

      .modal.active { opacity: 1; pointer-events: all; }

      .modal-overlay {
          position: absolute; width: 100%; height: 100%;
          background: rgba(0,0,0,0.9);
          backdrop-filter: blur(5px);
      }

      .modal-content {
          position: relative; z-index: 10;
          display: flex; flex-direction: row;
          width: 85%; max-width: 1200px; height: 80vh;
          border-radius: 16px; overflow: hidden;
          transform: scale(0.95);
          transition: transform 0.4s ease;
      }

      .modal.active .modal-content { transform: scale(1); }

      .modal-left {
          flex: 1;
          display: flex; align-items: center; justify-content: center;
          padding: 20px;
          perspective: 1200px;
          user-select: none;
          -webkit-user-select: none;
          touch-action: none;
          overflow: hidden;
      }

      .flip-card-inner {
          position: relative;
          width: 100%; max-width: 400px;
          aspect-ratio: 791 / 1087;
          transform-style: preserve-3d;
          cursor: grab;
          will-change: transform;
      }

      .flip-card-inner.grabbing { cursor: grabbing; }
      .flip-card-inner.returning {
          transition: transform 0.6s cubic-bezier(.175,.885,.32,1.1);
      }

      .flip-card-front,
      .flip-card-back {
          position: absolute; top: 0; left: 0;
          width: 100%; height: 100%;
          backface-visibility: hidden;
          -webkit-backface-visibility: hidden;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      }

      .flip-card-front img,
      .flip-card-back img {
          width: 100%; height: 100%;
          object-fit: contain;
          pointer-events: none;
          display: block;
      }

      .flip-card-back { transform: rotateY(180deg); }

      .swipe-hint {
          position: absolute; bottom: 8px; left: 50%;
          transform: translateX(-50%);
          font-size: 0.8rem; color: #555;
          white-space: nowrap;
          opacity: 0;
          animation: fadeInHint 0.6s 0.5s forwards;
          pointer-events: none;
      }

      @keyframes fadeInHint {
          from { opacity: 0; }
          to   { opacity: 1; }
      }

      .modal-right {
          flex: 1;
          padding: 40px 50px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          overflow-y: auto;
      }

      .modal-right h2 {
          font-size: 2.2rem;
          margin-bottom: 15px;
          color: #fff;
      }

      .modal-right p {
          font-size: 1.1rem;
          line-height: 1.6;
          color: #bbb;
          margin-bottom: 12px;
      }

      .info-block {
          margin: 15px 0;
          padding: 12px 15px;
          background: rgba(255,255,255,0.05);
          border-radius: 8px;
          border-left: 3px solid #6366f1;
      }

      .info-block.limited {
          border-left-color: #f59e0b;
          background: rgba(245, 158, 11, 0.1);
      }

      .info-label {
          font-size: 0.85rem;
          color: #888;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          margin-bottom: 4px;
      }

      .info-value {
          font-size: 1.1rem;
          color: #fff;
          font-weight: 500;
      }

      .characters-list {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-top: 8px;
      }

      .character-tag {
          padding: 4px 12px;
          background: rgba(99, 102, 241, 0.2);
          border: 1px solid rgba(99, 102, 241, 0.4);
          border-radius: 15px;
          font-size: 0.9rem;
          color: #c7d2fe;
      }

      .special-edition {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-top: 5px;
      }

      .special-edition a {
          color: #6366f1;
          text-decoration: none;
          font-weight: 500;
          transition: color 0.2s;
      }

      .special-edition a:hover {
          color: #818cf8;
          text-decoration: underline;
      }

      .special-edition .no-link {
          color: #fff;
      }

      .nav-btn {
          position: absolute; top: 50%;
          transform: translateY(-50%);
          background: rgba(255,255,255,0.1); color: white;
          border: none; width: 60px; height: 60px;
          border-radius: 50%; font-size: 24px;
          cursor: pointer; z-index: 20;
          transition: background 0.3s, transform 0.2s;
          display: flex; align-items: center; justify-content: center;
      }

      .nav-btn:hover {
          background: rgba(255,255,255,0.3);
          transform: translateY(-50%) scale(1.1);
      }

      .prev-btn { left: 20px; }
      .next-btn { right: 20px; }

      .close-btn {
          position: absolute; top: 20px; right: 30px;
          background: none; color: white; border: none;
          font-size: 36px; cursor: pointer; z-index: 20;
          transition: color 0.3s;
      }

      .close-btn:hover { color: #ff4c4c; }

      @keyframes slideNext {
          0%   { opacity: 0; transform: translateX(50px); }
          100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes slidePrev {
          0%   { opacity: 0; transform: translateX(-50px); }
          100% { opacity: 1; transform: translateX(0); }
      }

      .anim-next { animation: slideNext 0.4s forwards; }
      .anim-prev { animation: slidePrev 0.4s forwards; }

      .empty-state {
          text-align: center;
          padding: 60px 20px;
          color: #666;
          grid-column: 1 / -1;
      }

      .empty-state svg {
          width: 80px;
          height: 80px;
          margin-bottom: 20px;
          opacity: 0.3;
      }

      @media (max-width: 900px) {
          body { padding: 20px 10px; }
          .filter-bar { padding: 0 10px; margin-bottom: 20px; }
          .gallery-grid {
              grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
              gap: 15px;
          }
          .modal-content {
              flex-direction: column;
              width: 95%; height: 90vh; overflow-y: auto;
          }
          .modal-left {
              height: auto; min-height: 45vh; padding: 15px;
          }
          .flip-card-inner { max-width: 240px; }
          .modal-right {
              height: auto; padding: 25px 20px;
              justify-content: flex-start;
          }
          .modal-right h2 { font-size: 1.8rem; margin-bottom: 12px; }
          .modal-right p  { font-size: 1rem; }
          .nav-btn { width: 45px; height: 45px; font-size: 18px; }
          .prev-btn { left: 10px; }
          .next-btn { right: 10px; }
          .close-btn { top: 10px; right: 15px; font-size: 30px; }
      }
  </style>
</head>
<body>

<div class="filter-bar" id="filterBar">
  <span class="filter-label">Фильтр по маркету:</span>
  <div class="market-filters" id="marketFilters"></div>
</div>

<div class="gallery-grid" id="gallery"></div>

<div class="modal" id="modal">
  <div class="modal-overlay" id="overlay"></div>

  <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>

  <div class="modal-content" id="modal-content">
    <div class="modal-left" id="modal-left">
      <div class="flip-card-inner" id="flipCard">
        <div class="flip-card-front">
          <img id="modal-img" src="" alt="Front">
        </div>
        <div class="flip-card-back">
          <img id="modal-img-back" src="" alt="Back">
        </div>
      </div>
      <div class="swipe-hint">← Свайпайте для просмотра обратной стороны →</div>
    </div>
    <div class="modal-right">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>

      <div id="card-details"></div>
    </div>
  </div>

  <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
  <button class="close-btn" id="closeBtn">&times;</button>
</div>

<script>
    const cardsData = [
        {
            image: 'cards/image_2026-05-20_23-17-18.png',
            backImage: 'cards/image_2026-05-20_23-17-18 (2).png',
            title: 'Карточка 1',
            desc: 'Описание первой карточки',
            market: 'стимис',
            edition: 500,
            characters: ['Энси', 'раф'],
            eventLink: 'https://cerf.wtf'
        },
        {
            image: 'cards/image_2026-05-20_18-00-09 (2).png',
            backImage: 'cards/back_2.png',
            title: 'Карточка 2',
            desc: 'Описание второй карточки',
            market: 'гог',
            edition: 1000,
            characters: ['Персонаж В'],
            eventLink: null
        },
        {
            image: 'cards/image_2026-05-20_18-00-09 (4).png',
            title: 'Карточка 3',
            desc: 'пиздец',
            market: 'гог',
            edition: 250,
            characters: ['мяясм', 'ямс'],
            eventLink: 'https://cerf.wtf'
        },
        {
            image: 'cards/image_2026-05-20_18-00-09 (5).png',
            title: 'Карточка 4',
            desc: 'Обычная карточка',
            market: 'гог',
            characters: ['ыва'],
            eventLink: null
        },
        {
            image: 'cards/image_2026-05-20_18-00-09 (6).png',
            title: 'Карточка 5',
            desc: 'ыыыыыы',
            market: 'Мегамаркет озон',
            edition: 100,
            characters: ['хуй1', 'хуй2'],
            eventLink: 'https://cerf.wtf'
        },
    ];

    cardsData.forEach(c => { if (!c.backImage) c.backImage = c.image; });

    const gallery      = document.getElementById('gallery');
    const modal        = document.getElementById('modal');
    const overlay      = document.getElementById('overlay');
    const closeBtn     = document.getElementById('closeBtn');
    const prevBtn      = document.getElementById('prevBtn');
    const nextBtn      = document.getElementById('nextBtn');
    const modalImg     = document.getElementById('modal-img');
    const modalImgBack = document.getElementById('modal-img-back');
    const modalTitle   = document.getElementById('modal-title');
    const modalDesc    = document.getElementById('modal-desc');
    const modalContent = document.getElementById('modal-content');
    const flipCard     = document.getElementById('flipCard');
    const modalLeft    = document.getElementById('modal-left');
    const marketFilters = document.getElementById('marketFilters');
    const cardDetails  = document.getElementById('card-details');

    let currentIndex = 0;
    let currentFilter = 'all';
    let filteredCards = [...cardsData];

    function getUniqueMarkets() {
        const markets = new Set();
        cardsData.forEach(card => {
            if (card.market) markets.add(card.market);
        });
        return Array.from(markets).sort();
    }

    function renderMarketFilters() {
        const markets = getUniqueMarkets();
        marketFilters.innerHTML = '';

        const allBtn = document.createElement('button');
        allBtn.className = 'market-btn all active';
        allBtn.textContent = 'Все';
        allBtn.dataset.market = 'all';
        allBtn.addEventListener('click', () => applyFilter('all'));
        marketFilters.appendChild(allBtn);

        markets.forEach(market => {
            const btn = document.createElement('button');
            btn.className = 'market-btn';
            btn.textContent = market;
            btn.dataset.market = market;
            btn.addEventListener('click', () => applyFilter(market));
            marketFilters.appendChild(btn);
        });
    }

    function applyFilter(market) {
        currentFilter = market;

        document.querySelectorAll('.market-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.market === market);
        });

        if (market === 'all') {
            filteredCards = [...cardsData];
        } else {
            filteredCards = cardsData.filter(card => card.market === market);
        }

        renderGallery();

        if (modal.classList.contains('active') && filteredCards.length > 0) {
            const currentCard = cardsData[currentIndex];
            const isInFilter = filteredCards.includes(currentCard);
            if (!isInFilter) {
                currentIndex = cardsData.indexOf(filteredCards[0]);
                updateModalContent();
            }
        }
    }

    function renderGallery() {
        gallery.innerHTML = '';

        filteredCards.forEach((card) => {
            const originalIndex = cardsData.indexOf(card);
            const el = document.createElement('div');
            el.classList.add('card');
            el.innerHTML = `<img src="${card.image}" alt="${card.title}" loading="lazy">`;
            el.addEventListener('click', () => openModal(originalIndex));
            gallery.appendChild(el);
        });
    }

    function formatCardDetails(card) {
        let html = '';

        if (card.edition !== undefined && card.edition !== null) {
            html += `
                <div class="info-block limited">
                    <div class="info-label">Статус выпуска</div>
                    <div class="info-value">
                        Лимитированная <span style="color:#888;font-weight:normal">${card.edition} шт.</span>
                    </div>
                </div>
            `;
        }

        if (card.market) {
            const marketContent = card.eventLink
                ? `<a href="${card.eventLink}" target="_blank" rel="noopener">${card.market}</a>`
                : `<span class="no-link">${card.market}</span>`;

            html += `
                <div class="info-block">
                    <div class="info-label">Специальное издание</div>
                    <div class="special-edition">
                        ${marketContent}
                    </div>
                </div>
            `;
        }

        if (card.characters && card.characters.length > 0) {
            html += `
                <div class="info-block">
                    <div class="info-label">Персонажи</div>
                    <div class="characters-list">
                        ${card.characters.map(char => `<span class="character-tag">${char}</span>`).join('')}
                    </div>
                </div>
            `;
        }

        return html;
    }

    function openModal(index) {
        currentIndex = index;
        updateModalContent();
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
        resetCard();
    }

    function updateModalContent(animClass = '') {
        const data = cardsData[currentIndex];

        modalContent.classList.remove('anim-next', 'anim-prev');
        void modalContent.offsetWidth;
        if (animClass) modalContent.classList.add(animClass);

        modalImg.src     = data.image;
        modalImgBack.src = data.backImage;
        modalTitle.textContent = data.title;
        modalDesc.textContent  = data.desc;

        cardDetails.innerHTML = formatCardDetails(data);

        resetCard();
    }

    function showNext() {
        const currentFilteredIndex = filteredCards.indexOf(cardsData[currentIndex]);
        const nextFilteredCard = filteredCards[(currentFilteredIndex + 1) % filteredCards.length];
        currentIndex = cardsData.indexOf(nextFilteredCard);
        updateModalContent('anim-next');
    }

    function showPrev() {
        const currentFilteredIndex = filteredCards.indexOf(cardsData[currentIndex]);
        const prevFilteredCard = filteredCards[(currentFilteredIndex - 1 + filteredCards.length) % filteredCards.length];
        currentIndex = cardsData.indexOf(prevFilteredCard);
        updateModalContent('anim-prev');
    }

    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', closeModal);
    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);

    document.addEventListener('keydown', e => {
        if (!modal.classList.contains('active')) return;
        if (e.key === 'Escape')     closeModal();
        if (e.key === 'ArrowRight') showNext();
        if (e.key === 'ArrowLeft')  showPrev();
    });

    const ROTATION_FACTOR = 0.45;
    const MAX_ROTATE_X   = 35;
    const MAX_ROTATE_Y   = 180;
    const FRICTION        = 0.92;
    const VELOCITY_CUTOFF = 0.25;

    let dragging  = false;
    let startX = 0, startY = 0;
    let velX = 0, velY = 0;
    let lastPtX = 0, lastPtY = 0;
    let lastTime = 0;
    let rafId = null;
    let state = { rx: 0, ry: 0 };

    function resetCard() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        flipCard.classList.remove('returning', 'grabbing');
        flipCard.style.transform = '';
        state = { rx: 0, ry: 0 };
        velX = 0;
        velY = 0;
    }

    function setTransform(rx, ry) {
        flipCard.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    }

    function onDown(e) {
        if (e.target.closest('.nav-btn, .close-btn')) return;
        e.preventDefault();
        dragging = true;
        flipCard.classList.add('grabbing');
        flipCard.classList.remove('returning');
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        const pt = e.touches ? e.touches[0] : e;
        startX   = pt.clientX;
        startY   = pt.clientY;
        lastPtX  = pt.clientX;
        lastPtY  = pt.clientY;
        lastTime = performance.now();
        velX = 0;
        velY = 0;
    }

    function onMove(e) {
        if (!dragging) return;
        e.preventDefault();
        const pt = e.touches ? e.touches[0] : e;
        const now = performance.now();
        const dt  = Math.max(now - lastTime, 1);
        const dx = pt.clientX - startX;
        const dy = pt.clientY - startY;
        const ddx = pt.clientX - lastPtX;
        const ddy = pt.clientY - lastPtY;
        velX = (ddx / dt) * ROTATION_FACTOR * 16;
        velY = (ddy / dt) * ROTATION_FACTOR * 16;
        state.ry = dx * ROTATION_FACTOR;
        state.rx = -dy * ROTATION_FACTOR;
        state.rx = Math.max(-MAX_ROTATE_X, Math.min(MAX_ROTATE_X, state.rx));
        state.ry = Math.max(-MAX_ROTATE_Y, Math.min(MAX_ROTATE_Y, state.ry));
        setTransform(state.rx, state.ry);
        lastPtX  = pt.clientX;
        lastPtY  = pt.clientY;
        lastTime = now;
    }

    function onUp() {
        if (!dragging) return;
        dragging = false;
        flipCard.classList.remove('grabbing');
        rafId = requestAnimationFrame(inertiaLoop);
    }

    function inertiaLoop() {
        velX *= FRICTION;
        velY *= FRICTION;
        state.ry += velX;
        state.rx -= velY;
        const speed = Math.sqrt(velX * velX + velY * velY);
        if (speed < VELOCITY_CUTOFF) {
            flipCard.classList.add('returning');
            state = { rx: 0, ry: 0 };
            setTransform(0, 0);
            return;
        }
        state.rx = Math.max(-MAX_ROTATE_X * 1.5, Math.min(MAX_ROTATE_X * 1.5, state.rx));
        state.ry = Math.max(-MAX_ROTATE_Y, Math.min(MAX_ROTATE_Y, state.ry));
        setTransform(state.rx, state.ry);
        rafId = requestAnimationFrame(inertiaLoop);
    }

    modalLeft.addEventListener('mousedown',  onDown);
    document.addEventListener('mousemove',   onMove);
    document.addEventListener('mouseup',     onUp);
    modalLeft.addEventListener('touchstart', onDown, { passive: false });
    modalLeft.addEventListener('touchmove',  onMove, { passive: false });
    modalLeft.addEventListener('touchend',   onUp);

    function init() {
        renderMarketFilters();
        renderGallery();
    }

    init();
</script>
</body>
</html>
